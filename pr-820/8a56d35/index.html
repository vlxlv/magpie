<main><h1>#820 界面预览</h1><p class="m">commit 8a56d35 · <a href="https://github.com/yetone/magpie/pull/820">回到 PR</a> · 这次改动给「放弃未保存的修改」和几处立即生效的删除加了一个应用内置样式的确认对话框（dialog.action-confirm），并把供应商/路由/资源库编辑器、账户与密钥移除接上它；同时给编辑器补上对话框语义、焦点循环、标签关联、导航的 aria-current 与开关的 aria-pressed，并把窗口模式/平台类与主题、字号提前到首帧之前应用。</p>
